# A private SearXNG instance for Lucy's `web_search` tool.
# Reachable only from this machine at http://127.0.0.1:8890 (see README.md).
name: lucy-searxng

services:
  searxng:
    image: searxng/searxng:latest
    container_name: lucy-searxng
    restart: unless-stopped
    ports:
      # Bound to the loopback address only: nothing outside this machine can reach it.
      - "127.0.0.1:8890:8080"
    environment:
      # Created once with the command in README.md; .env is gitignored.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?create deploy/searxng/.env first (see README.md)}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng-cache:
