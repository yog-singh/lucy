# Example Lucy settings. Copy to lucy.toml and adjust.
# In each section, `adapter` picks the registered adapter; every other key is
# passed to that adapter's constructor.

[llm.roles]
# `context_window` is Lucy's own prompt budget (kept small for latency); it is
# not sent to the server. `extra` is merged into every request: thinking is off
# (`reasoning_effort = "none"`), which cuts time to first token from seconds
# to a fraction of a second.
# All three roles use the same model, so only one is loaded. Extraction with
# gemma4:12b-mlx found 24 to 25 of 25 expected items in the live evaluation
# (17 to 20 with qwen3.5:2b-mlx); it runs at temperature 0, and `max_tokens`
# caps a runaway structured response (one uncapped run hung for over 150 s).
# The summary role writes the profile and entity summaries and checks
# duplicate-entity merges.
#
# Silent replies: with thinking off and tools offered (or tool calls earlier in
# the conversation), gemma4:12b-mlx sometimes repeats an empty thought block
# that Ollama strips, so nothing arrives. `hidden_loop_repeats` asks Ollama for
# logprobs, which show those hidden tokens, and ends such a reply after the
# block repeats 4 times (about 0.6 s; normal replies have at most 2). Cost:
# logprobs switch off Ollama's speculative decoding, so replies generate about
# a third slower (33 instead of 49 tokens/s); remove the option to trade that
# for slower recovery. A reply that produces nothing is then asked once more of
# `fallback`, the same model with thinking on (never seen to loop), and the
# retry is logged and shown in the turn's trace. `first_output_timeout` gives
# up on a reply that shows nothing for that many seconds (a long uncached
# prompt can take about 35 s before its first token). `max_tokens` is a
# backstop: the longest replies measured were about 300 tokens, and a loop
# that is not detected ends at the cap (about 30 s) instead of the 120 s read
# timeout. Adding `after_tool = "chat_deep"` to the chat role would answer every
# lookup with thinking on: on Lucy's grounding check it followed the looked-up
# facts slightly more often (49 against 46 of 56) but its first word after a
# lookup came about 1.6 s later, so it is off.
chat       = { adapter = "ollama", model = "gemma4:12b-mlx", context_window = 32768, hidden_loop_repeats = 4, fallback = "chat_deep", first_output_timeout = 60, extra = { reasoning_effort = "none", max_tokens = 1024 } }
chat_deep  = { adapter = "ollama", model = "gemma4:12b-mlx", context_window = 32768, extra = { reasoning_effort = "low", max_tokens = 4096 } }
extraction = { adapter = "ollama", model = "gemma4:12b-mlx", context_window = 32768, temperature = 0, extra = { reasoning_effort = "none", max_tokens = 2048 } }
summary    = { adapter = "ollama", model = "gemma4:12b-mlx", context_window = 32768, extra = { reasoning_effort = "none", max_tokens = 1024 } }

[stt]
# Speech recognition for `lucy voice` (only loaded by it). Parakeet runs in
# this process on Apple silicon; its weights (2.5 GB) are downloaded from
# Hugging Face on first use. `cache_limit_mb` caps MLX's buffer cache (without
# it the memory footprint nearly doubles).
adapter        = "parakeet_mlx"
model          = "mlx-community/parakeet-tdt-0.6b-v2"
cache_limit_mb = 256

[tts]
# Speech synthesis for `lucy voice`, served by Ollama (`ollama pull phonon`).
# `phonon` (phonon:latest) is the Apache-2.0 build; phonon:40m-en is licensed
# for non-commercial use only. `voice` is "default" or one of the model's named
# voices (`ollama show phonon --verbose`, or an unknown name lists them).
adapter = "ollama"
model   = "phonon"
voice   = "default"

[voice]
# Optional; these are the defaults. How `lucy voice` listens.
# Silence after speech that ends your turn. Lower answers sooner but may cut
# you off when you pause mid-sentence.
endpoint_silence_ms = 600
# Continuous speech needed before Lucy treats a sound as speech (clicks and
# knocks are shorter).
min_speech_ms       = 160
# Audio kept from just before speech was detected, so the first syllable is
# not lost.
preroll_ms          = 300
# Longest single utterance; a longer one is sent as it is.
max_utterance_s     = 30
# How long the microphone stays ignored after Lucy stops speaking, so she does
# not hear the end of her own voice.
tail_ms             = 300
# Speech probability (Silero VAD) from which a 32 ms frame counts as speech.
vad_threshold       = 0.5
# Devices: a number or part of a name from `lucy voice --list-devices`. Unset
# means the system default microphone and speaker.
# input_device  = "MacBook Pro Microphone"
# output_device = "MacBook Pro Speakers"

[wake]
# Optional; these are the defaults. How `lucy listen` waits for the wake phrase
# before a voice turn (`lucy voice` ignores this section). The models are
# openWakeWord's pretrained ones (CC BY-NC-SA 4.0, non-commercial use only),
# downloaded by `lucy listen --download-models` into data/models/wakeword/.
# The phrase as spoken; it is removed from the start of what Lucy hears.
phrase           = "hey jarvis"
model            = "data/models/wakeword/hey_jarvis_v0.1.onnx"
# Score (0 to 1) from which the phrase counts as said. Higher: fewer false
# wakes, more misses.
threshold        = 0.5
# After a reply, how long you can speak again without the wake phrase.
followup_seconds = 8
# A short chime on waking, and a falling one on going back to waiting.
chime            = true

[embedder]
# Ollama adds no prefixes (the model template is the bare prompt), so the
# adapter prepends them by kind. For embeddinggemma-2, "query: " / "passage: "
# retrieved best on Lucy's personal-fact test set (20/22 top-1, MRR 0.955 vs
# 19/22, 0.932 unprefixed and 19/22, 0.924 with EmbeddingGemma's task prefixes).
# Ollama reports embedding_length 512, but the API returns 768-dim vectors.
adapter         = "ollama"
model           = "embeddinggemma-2"
dimensions      = 768
query_prefix    = "query: "
document_prefix = "passage: "

[memory]
adapter = "sqlite"
path    = "data/lucy.db"

[learning]
# Optional; these are the defaults. Lucy learns from conversation in the
# background when an [embedder] is configured and memory is "sqlite".
# `enabled = false` keeps chat working with conversation replay only.
enabled                    = true
# How often decay, entity summaries, duplicate merging and the profile rewrite
# run (checked at startup and hourly while Lucy runs).
maintenance_interval_hours = 24
# Turns one extraction job processes before handing over to a follow-up job.
extract_max_turns          = 4
# How long an inferred statement (a habit or preference Lucy worked out) keeps
# its confidence after it was last observed, and how fast it fades after that
# (halving every `decay_half_life_days`). With 30 / 30, a weekly habit that stops
# becomes uncertain (below 0.6) about seven weeks after it was last seen and
# negligible after about four months; a monthly habit that continues is not
# punished. Stated statements never decay.
decay_grace_days           = 30
decay_half_life_days       = 30

[retrieval]
# Optional; these are the defaults. Which statements a turn gets. The similarity
# values are cosine similarities measured for embeddinggemma-2 with the
# "query: " / "passage: " prefixes above (its scores sit in a narrow band:
# unrelated statements 0.53 to 0.76, relevant ones 0.61 to 0.85). Measure them
# again if you change the embedding model or its prefixes.
# A statement found by meaning must be at least this similar to the message...
vector_min_similarity  = 0.68
# ...and at most this far below the best match.
vector_margin          = 0.06
# A keyword match must also be at least this similar (a shared common word such
# as "works" is not relevance). -1 turns the check off.
keyword_min_similarity = 0.62
# People, places and things similar to the message (not named in it) bring in
# their statements only from this similarity up.
entity_min_similarity  = 0.75
# At most this many statements per turn.
max_statements         = 8

[tools]
# Optional. Tools let the chat model look things up, mostly on the internet.
# None are enabled by default, so Lucy makes no network requests of her own.
# Enabling a web tool sends data off this machine: `wikipedia` sends the
# search query to Wikipedia; `web_search` sends it to the SearXNG instance
# below, which passes it on to the search engines it queries; `fetch_page`
# requests the page address the model chose from that site. `time` gives the
# date and time in a named city, country or time zone from this machine's
# time-zone database; it sends nothing off the machine and has no options.
# `weather` sends the place name the model chose to Open-Meteo's geocoding
# service (geocoding-api.open-meteo.com) and that place's coordinates, rounded
# to two decimals (about a kilometre), to its forecast service
# (api.open-meteo.com); nothing else. Open-Meteo's free API needs no key and is
# for non-commercial use (under 10,000 calls a day; data under CC BY 4.0).
# To opt in, uncomment:
# enabled = ["wikipedia", "web_search", "fetch_page", "time", "weather"]
#
# Every internet tool also takes `max_chars` (longest result given to the
# model, default 6000) and `timeout` (seconds per call, default 10).

[tools.wikipedia]
# Wikipedia language edition, as in its address (en.wikipedia.org).
language = "en"

[tools.web_search]
# Your SearXNG instance (required when web_search is enabled). deploy/searxng/
# runs one on this address; see its README.
searxng_url = "http://127.0.0.1:8890"
max_results = 5

[tools.fetch_page]
# fetch_page reads only public web pages: http(s) addresses without passwords
# whose host resolves to public IP addresses, each redirect checked again, with
# size, time and content-type limits. This keeps a page's text from steering
# the model into local services (the router, Ollama, SearXNG). Hosts listed
# here may be on the local network anyway: exact host names, IP addresses or
# networks, e.g. ["homeassistant.local", "192.168.1.20"]. Keep it empty
# unless you need it.
allow_private_hosts = []
max_bytes           = 2000000
max_redirects       = 5

[tools.weather]
# "metric" (°C, km/h, mm) or "imperial" (°F, mph, inches).
units = "metric"

[context]
# Optional; this is the default. How the chat prompt is arranged.
# "stable_prefix": the system message holds only what rarely changes (persona,
# tool guidance, standing instructions, profile), then the conversation; the
# date and time and the memories retrieved for this message follow the latest
# message. Each turn's prompt then extends the previous one, so the model
# server reuses its cached work (voice: 1.30 s from the end of speech to the
# first audio, against 1.62 s), and the start of the next prompt can be
# prepared in advance ([residency]). Nothing stored changes. Measured with
# gemma4:12b-mlx, it answered as well as "system" on Lucy's grounding check,
# tool-choice regression and memory evaluation.
# "system": everything, including the date and the memories, in one system
# message before the conversation; the server reprocesses the whole
# conversation on every turn. Kept so a change can be reverted here.
layout = "stable_prefix"

[residency]
# Optional; these are the defaults. Keeps the chat model's memory on the model
# server bounded. Ollama's MLX runner keeps a prompt cache that grows by about
# 1 GB per request up to about 16 GB, and no setting limits it; unloading the
# model frees it. So once Lucy has been idle for a moment after model work, she
# unloads the chat model, loads it again at once and pre-fills the start of
# the next turn's prompt, so the next reply still starts quickly. Measured with
# gemma4:12b-mlx in voice: the model stayed at about 8.4 GB (10 GB at most)
# instead of 14 to 16 GB, with the time to the first spoken word unchanged.
# It works with the `ollama` adapter only (others ignore this section) and
# needs the "stable_prefix" layout above to pre-fill anything; with "system"
# the model is only reloaded. Unloading frees the model for every client of
# the server, so another program using the same model at that moment would
# have to wait for it to load again.
enabled            = true
# Nothing running or due (no turn, speech, model request or background job)
# for this many seconds. In voice this is all: the unload and re-warm happen
# while Lucy's reply is still playing.
idle_seconds       = 1.0
# Outside a voice session, also wait this long after Lucy's last reply. In
# text chat the re-warm takes 5 to 8 s for a long conversation, and a message
# that arrives before it has finished starts slower. Measured over 20 turns:
# with 8 s between messages nothing is unloaded (no turn is slowed; the model
# grows as it would without this policy); with 20 s between messages the model
# stays at about 10 GB and the first word comes after 0.36 s (median). 15
# would collide with replies sent about 20 s apart (first word 3.3 s median).
text_quiet_seconds = 10.0
# Unload only when the model takes at least this many GB. Unset: whenever the
# rules above allow. 10 to 12 keeps it loaded longer at the cost of memory.
# min_size_gb = 12
